apply from: "https://raw.githubusercontent.com/SteveKunG/GradleScripts/main/architectury/forge.gradle"

loom {
    runs.configureEach {
        properties project.commonProperties
        vmArgs project.commonVmArgs
        vmArgs project.hotswapVmArgs
    }

    forge {
        mixinConfig("mixins.${archives_base_name}_forge.json")

        mixin {
            useLegacyMixinAp = true
            defaultRefmapName = "mixins.${archives_base_name}_forge.refmap.json"
        }
    }

    runs {
        client {
            if (project.hasProperty("usernameAndUUID")) {
                programArgs project.usernameAndUUID
            }
        }
        data {
            forgeTemplate("data")
            environment "data"
            programArgs "--mod=fishofthieves", "--all", "--output=" + file("src/generated/resources/"), "--existing=" + project(":common").file("src/main/resources/")
            name "Forge Data Generation"
        }
    }
}

repositories {
    maven {
        name = "Aquaculture 2"
        url = "https://girafi.dk/maven/"
        content {
            includeGroup "com.teammetallurgy.aquaculture"
        }
    }
}

dependencies {
    api "com.teammetallurgy.aquaculture:aquaculture2_${minecraft_version}:${aquaculture_version}:api"
    modImplementation "com.github.glitchfiend:TerraBlender-forge:${minecraft_version}-${terrablender_version}"
    modCompileOnly "com.github.glitchfiend:SereneSeasons-forge:${minecraft_version}-${serene_seasons_version}"
    modImplementation "com.github.glitchfiend:GlitchCore-forge:${minecraft_version}-${glitchcore_version}"
    modRuntimeOnly "maven.modrinth:cyanide:${cyanide_forge_version}"

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${mixinextras_version}"))
    implementation(include("com.moulberry:mixinconstraints:${mixin_constraints_version}"))
}

List<String> commonExcludes = [".cache", "data/fabric/**", "gametest_structures/**", "regular_structures/**", "architectury.common.json"]

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev"
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
    excludes = commonExcludes
}

sourcesJar {
    Jar commonSources = project(":common").sourcesJar
    dependsOn commonSources
    commonSources.exclude ".cache"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from commonSources.archiveFile.map { zipTree(it) }
    excludes = commonExcludes
}

tasks.register("apiJar", Jar) {
    group = "build"
    from project(":common").sourceSets.main.allJava
    from project(":common").sourceSets.main.output
    include "com/stevekung/fishofthieves/api/**/*"
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
    archiveClassifier = "api"
}

assemble.dependsOn(apiJar)

remapSourcesJar {
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "forge" + (release_type != "release" ? "-" + release_type : "")
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
}