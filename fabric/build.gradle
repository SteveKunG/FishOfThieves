apply from: "https://raw.githubusercontent.com/SteveKunG/GradleScripts/main/architectury/fabric.gradle"

sourceSets {
    gametest {
        runtimeClasspath += main.runtimeClasspath + main.output
        compileClasspath += main.compileClasspath + main.output
    }
}

loom {
    runs.configureEach {
        properties project.commonProperties
        vmArgs project.commonVmArgs
        vmArgs project.hotswapVmArgs
    }

    mixin {
        useLegacyMixinAp = true
    }

    runs {
        client {
            if (project.hasProperty("usernameAndUUID")) {
                programArgs project.usernameAndUUID
            }
        }
        clientBiolith {
            client()
            if (project.hasProperty("usernameAndUUID")) {
                programArgs project.usernameAndUUID
            }
            programArgs "--quickPlaySingleplayer", "Biolith"
        }
        gametest {
            if (project.hasProperty("usernameAndUUID")) {
                programArgs project.usernameAndUUID
            }
            client()
            name "Game Test Client"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
        }
        datagen {
            server()
            name "Fabric Data Generation"
            property "fabric-api.datagen"
            property "fabric-api.datagen.strict-validation"
            property "fabric-api.datagen.modid", "${mod_id}"
            property "fabric-api.datagen.output-dir", "${project(":common").file("src/generated/resources")}"
            runDir "build/datagen"
        }
    }
}

repositories {
    maven {
        name = "Fabric ASM"
        url = "https://jitpack.io/"
        content {
            includeGroup "com.github.Chocohead"
        }
    }
    maven {
        url = "https://chocolateminecraft.com/maven"
        name = "Xaero's Maven"
    }
    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        name = "Fuzs Mod Resources"
    }
    maven {
        url = "https://mvn.devos.one/releases/"
        name = "Porting Lib"
    }
}

dependencies {
    modRuntimeOnly("maven.modrinth:continuity:${continuity_version}")
    modRuntimeOnly("maven.modrinth:cyanide:${cyanide_fabric_version}")
    modRuntimeOnly("maven.modrinth:xaeros-minimap:fabric-${xaeros_minimap_version}")
    modRuntimeOnly("xaero.lib:xaerolib-fabric-${minecraft_version}:+") {
        exclude group: "net.fabricmc.fabric-api"
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
    modImplementation("com.terraformersmc:biolith-fabric:${biolith_version}") {
        exclude group: "net.fabricmc.fabric-api"
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
    modCompileOnly("com.github.glitchfiend:SereneSeasons-fabric:${minecraft_version}-${serene_seasons_version}") {
        exclude group: "net.fabricmc.fabric-api"
        exclude group: "net.fabricmc", module: "fabric-loader"
    }
    modRuntimeOnly("maven.modrinth:structure-void-toggle:4.2.7+1.20.1_fabric")
    modRuntimeOnly("maven.modrinth:world-preview:1.3.1")
    modImplementation("maven.modrinth:kaleidoscope-cookery-refabricated:${kaleidoscope_cookery_refabricated_version}")
    modImplementation("fuzs.forgeconfigscreens:forgeconfigscreens-fabric:${forge_config_api_port_version}") {
        exclude group: "net.fabricmc.fabric-api"
        exclude group: "net.fabricmc", module: "fabric-loader"
        exclude group: "com.terraformersmc", module: "modmenu"
    }
    modImplementation("io.github.fabricators_of_create.Porting-Lib:entity:${porting_lib_version}")
    modImplementation("io.github.fabricators_of_create.Porting-Lib:loot:${porting_lib_version}")
    modImplementation(include("com.github.Chocohead:Fabric-ASM:v2.3"))
    modImplementation(include("com.moulberry:mixinconstraints:${mixin_constraints_version}"))
}

List<String> devExcludes = ["**/gametest/", "**/datagen/", "data/forge/**", "gametest_structures/**", "regular_structures/**", "architectury.common.json", "resourcepacks/simple_spawning_condition_pack/**"]

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev"
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
    excludes = devExcludes
}

sourcesJar {
    Jar commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    excludes = devExcludes
}

tasks.register("apiJar", Jar) {
    group = "build"
    from project(":common").sourceSets.main.allJava
    from project(":common").sourceSets.main.output
    include "com/stevekung/fishofthieves/api/**/*"
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
    archiveClassifier = "api"
}

assemble.dependsOn(apiJar)

remapSourcesJar {
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = "fabric" + (release_type != "release" ? "-${release_type}" : "")
    archiveVersion = "v${mod_version}"
    archiveBaseName = project(":common").ext.fileName
}

processGametestResources {
    File sourceDir = project(":fabric").file("src/gametest/resources/data/minecraft/gametest/structure")
    File destinationDir = project(":fabric").file("run/gameteststructures")

    if (!destinationDir.exists()) {
        destinationDir.mkdirs()
    }

    sourceDir.eachFileRecurse { File file ->
        if (file.isFile()) {
            File targetFile = new File(destinationDir, sourceDir.toPath().relativize(file.toPath()).toString())

            file.withInputStream { input ->
                targetFile.withOutputStream { output ->
                    output << input
                }
            }
        }
    }
}