modLoader = "javafml"
loaderVersion = "[2,)"
license = "MIT"
issueTrackerURL = "https://github.com/SteveKunG/FishOfThieves/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${display_name}"
description = "${mod_description}"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/fish-of-thieves"
updateJSONURL = "https://api.modrinth.com/updates/fish-of-thieves/forge_updates.json?neoforge=only"
logoFile = "logo.png"
authors = "SteveKunG, PloyiinGz, Gucc1Guy"
enumExtensions = "META-INF/enumextensions.json"

[[mixins]]
config = "mixins.fish_of_thieves.json"
[[mixins]]
config = "mixins.fish_of_thieves_neoforge.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.fishofthieves]]
modId = "neoforge"
type = "required"
versionRange = "[21.10.0-beta,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.fishofthieves]]
modId = "cloth_config"
type = "required"
versionRange = "[20.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.fishofthieves]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.10,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.fishofthieves]]
modId = "aquaculture"
type = "optional"
versionRange = "[1.19.4-2.4.10,)"
ordering = "NONE"
side = "BOTH"