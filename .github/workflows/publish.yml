name: publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (Example: mc26.1.2-v26.1.2.2.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create version tag
        uses: actions/github-script@v9
        with:
          script: |
            const tagName = "${{ github.event.inputs.version }}";

            // Check if the tag already exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tagName}`
              });
              console.log(`Tag "${tagName}" already exists. Skipping...`);
            } catch (error) {
              if (error.status === 404) {
                // Tag not found → create it
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tagName}`,
                  sha: context.sha
                });
                console.log(`Created new tag: ${tagName}`);
              } else {
                throw error;
              }
            }

      - name: Fetch tags
        run: git fetch --tags

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Publish Mod to CurseForge/Modrinth
        run: ./gradlew curseforgeModrinthNeoForge curseforgeModrinthFabric -Pupload_debug=false -Pcurseforge_api_token=${{ secrets.CURSEFORGE_API_TOKEN }} -Pmodrinth_api_token=${{ secrets.MODRINTH_API_TOKEN }}